[build]
  publish = "."
  command = "npm install --omit=dev"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/api/marvel-media"
  to = "/.netlify/functions/marvel-media"
  status = 200
  force = true
[[redirects]]
  from = "/api/marvel-profile"
  to = "/.netlify/functions/marvel-profile"
  status = 200
  force = true
